name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    
jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: "pip"
            
            - name: Install dependencies
              run: |
                pip install -r requirements.txt
                pip install -r requirements-dev.txt
            
            - name: Lint (ruff)
              run: ruff check .
            
            - name: type check (mypy)
              run: mypy app --ignore-missing-imports
            
            - name: Run tests
              env:
                DATABASE_URL: "sqlite:///:memory:"
                DISCORD_BOT_TOKEN: "test-token"
                DISCORD_SERVER_ID: "6353234234"
                DISCORD_APPROVAL_CHANNEL_ID: "123456789"
                GEMINI_API_KEY: "test-key"
                GEMINI_MODEL: "gemini-model"
                LINKEDIN_CLIENT_ID: "client-id"
                LINKEDIN_CLIENT_SECRET: "client-secret"
                LINKEDIN_ACCESS_TOKEN: "access-token"
                LINKEDIN_REFRESH_TOKEN: "refresh-token"
                LINKEDIN_PERSON_ID: "person-id"
                LINKEDIN_API_VERSION: "api-version"
                X_CLIENT_ID: "your_client_id"
                X_CLIENT_SECRET: "your_client_secret"
                X_ACCESS_TOKEN: "your_access_token_here"
                X_REFRESH_TOKEN: "your_refresh_token"
              run: pytest -v